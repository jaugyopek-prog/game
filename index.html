<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Seed of Aethelgard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-color: #f8fafc;
            --danger: #ef4444;
            --mana-color: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #game-container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        header h1 {
            color: var(--accent);
            font-size: 1.8rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Battlefield Layout */
        .battlefield {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 250px;
        }

        .section-title {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .unit-card {
            background: #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .unit-card.active {
            border: 2px solid var(--accent);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .unit-card.dead {
            opacity: 0.4;
            filter: grayscale(1);
        }

        .unit-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .bar-container {
            background: #0f172a;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 5px;
        }

        .hp-bar {
            height: 100%;
            background: var(--danger);
            width: 100%;
            transition: width 0.3s ease;
        }

        .mp-bar {
            height: 100%;
            background: var(--mana-color);
            width: 100%;
            transition: width 0.3s ease;
        }

        /* Controls & Logs */
        .controls-area {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .action-board {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .log-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            display: flex;
            flex-direction: column-reverse;
        }

        .log-entry {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .log-entry.hero-action { color: #38bdf8; }
        .log-entry.enemy-action { color: #f87171; }
        .log-entry.system { color: #facc15; }

        @media (max-width: 768px) {
            .battlefield, .controls-area {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1>🌱 The Last Seed of Aethelgard</h1>
        <p>การเดินทางเพื่อฟื้นฟูพฤกษาศักดิ์สิทธิ์และสร้างบ้านหลังใหม่</p>
    </header>

    <div class="status-bar">
        <span>📍 ด่านที่: <span id="stage-num">1</span> / 5</span>
        <span>🌳 พลังพฤกษา: <span id="seed-power">100</span>%</span>
        <span>🏆 EXP ปาร์ตี้: <span id="party-exp">0</span></span>
    </div>

    <div class="battlefield">
        <!-- Party Side -->
        <div>
            <div class="section-title">🛡️ ปาร์ตี้ผู้พิทักษ์</div>
            <div id="party-list"></div>
        </div>
        <!-- Enemy Side -->
        <div>
            <div class="section-title">👹 มอนสเตอร์ผู้รุกราน</div>
            <div id="enemy-list"></div>
        </div>
    </div>

    <div class="controls-area">
        <div class="action-board">
            <div id="turn-indicator" style="font-weight: bold; color: var(--accent);">ถึงเทิร์นของ: -</div>
            <div class="skills-grid" id="skills-container"></div>
        </div>
        <div>
            <div class="section-title">📜 บันทึกการต่อสู้</div>
            <div class="log-box" id="combat-log"></div>
        </div>
    </div>
</div>

<script>
// --- GAME DATA & STATE ---
const HEROES_BASE = [
    { id: 'eldrin', name: 'Eldrin', race: 'Human', role: 'Guardian', maxHp: 120, hp: 120, maxMp: 50, mp: 50, atk: 15, def: 10, speed: 10, skills: [
        { name: 'Strike', mpCost: 0, power: 1.0, type: 'damage', desc: 'โจมตีปกติ' },
        { name: 'Leaf Shield', mpCost: 15, power: 0, type: 'buff_def', desc: 'เพิ่ม DEF 40% ทั้งทีม' },
        { name: 'Nature Grace', mpCost: 30, power: 35, type: 'heal_all', desc: 'ฮีลเพื่อนทุกคน' }
    ]},
    { id: 'sylphira', name: 'Sylphira', race: 'High Elf', role: 'Arcane Weaver', maxHp: 75, hp: 75, maxMp: 100, mp: 100, atk: 25, def: 4, speed: 14, skills: [
        { name: 'Arcane Shot', mpCost: 0, power: 1.0, type: 'damage', desc: 'ยิงเวทปกติ' },
        { name: 'Chain Lightning', mpCost: 25, power: 1.4, type: 'aoe_damage', desc: 'โจมตีเวทหมู่' },
        { name: 'Focus Mind', mpCost: 10, power: 20, type: 'restore_mp', desc: 'ฟื้นฟู MP ให้ตัวเอง' }
    ]},
    { id: 'grommash', name: 'Grommash', race: 'Iron-Horn Orc', role: 'Berserker', maxHp: 140, hp: 140, maxMp: 30, mp: 30, atk: 22, def: 8, speed: 8, skills: [
        { name: 'Heavy Cleave', mpCost: 0, power: 1.1, type: 'damage', desc: 'ฟันหนัก' },
        { name: 'Battle Shout', mpCost: 15, power: 1.5, type: 'self_buff_atk', desc: 'บัฟ ATK 50%' },
        { name: 'Earthshaker', mpCost: 25, power: 2.0, type: 'damage', desc: 'ทุบพื้นรุนแรง' }
    ]},
    { id: 'nixie', name: 'Nixie', race: 'Shadow Catfolk', role: 'Shadow Blade', maxHp: 85, hp: 85, maxMp: 60, mp: 60, atk: 20, def: 5, speed: 18, skills: [
        { name: 'Quick Slash', mpCost: 0, power: 1.0, type: 'damage', desc: 'โจมตีความเร็วสูง' },
        { name: 'Shadow Strike', mpCost: 20, power: 1.8, type: 'damage', desc: 'แทงจุดตาย' },
        { name: 'Poison Edge', mpCost: 15, power: 1.2, type: 'damage', desc: 'โจมตีติดพิษ' }
    ]}
];

const STAGES = [
    { stage: 1, enemies: [{ name: 'Gloom Stalker', hp: 90, maxHp: 90, atk: 12, def: 3, speed: 11 }] },
    { stage: 2, enemies: [{ name: 'Stone Golem', hp: 160, maxHp: 160, atk: 18, def: 12, speed: 5 }] },
    { stage: 3, enemies: [{ name: 'Corrupted Treant', hp: 220, maxHp: 220, atk: 22, def: 8, speed: 9 }] },
    { stage: 4, enemies: [{ name: 'Ash Cultist A', hp: 130, maxHp: 130, atk: 20, def: 5, speed: 12 }, { name: 'Ash Cultist B', hp: 130, maxHp: 130, atk: 20, def: 5, speed: 12 }] },
    { stage: 5, enemies: [{ name: 'Abyssal Dragon (Boss)', hp: 450, maxHp: 450, atk: 32, def: 15, speed: 13 }] }
];

let party = [];
let enemies = [];
let currentStage = 0;
let turnOrder = [];
let currentTurnIndex = 0;
let partyExp = 0;

// --- INITIALIZATION ---
function initGame() {
    party = JSON.parse(JSON.stringify(HEROES_BASE));
    currentStage = 0;
    partyExp = 0;
    addLog("🌲 การเดินทางเริ่มต้นขึ้น... ปกป้องพฤกษาศักดิ์สิทธิ์!", "system");
    loadStage(currentStage);
}

function loadStage(stageIndex) {
    if (stageIndex >= STAGES.length) {
        addLog("🎉 คุณสามารถสร้างหมู่บ้านใหม่สำเร็จและปกป้องพฤกษาศักดิ์สิทธิ์ได้สำเร็จ!", "system");
        alert("คุณชนะเกม! สมบูรณ์แบบ!");
        return;
    }
    
    document.getElementById('stage-num').innerText = stageIndex + 1;
    enemies = JSON.parse(JSON.stringify(STAGES[stageIndex].enemies));
    
    // Reset status buffs
    party.forEach(h => { if(h.hp > 0) h.tempAtkBuff = 1; h.tempDefBuff = 1; });
    
    addLog(`⚔️ เข้าสู่ด่านที่ ${stageIndex + 1}! ศัตรูปรากฏตัว!`, "system");
    renderUnits();
    calculateTurnOrder();
    startTurn();
}

// --- RENDER SYSTEM ---
function renderUnits() {
    const partyContainer = document.getElementById('party-list');
    const enemyContainer = document.getElementById('enemy-list');
    
    partyContainer.innerHTML = '';
    enemyContainer.innerHTML = '';

    party.forEach((unit, idx) => {
        const activeClass = (turnOrder[currentTurnIndex] === unit) ? 'active' : '';
        const deadClass = unit.hp <= 0 ? 'dead' : '';
        const hpPercent = Math.max(0, (unit.hp / unit.maxHp) * 100);
        const mpPercent = Math.max(0, (unit.mp / unit.maxMp) * 100);

        partyContainer.innerHTML += `
            <div class="unit-card ${activeClass} ${deadClass}">
                <div class="unit-header">
                    <span>${unit.name} <small>(${unit.race})</small></span>
                    <span>HP: ${unit.hp}/${unit.maxHp}</span>
                </div>
                <div class="bar-container"><div class="hp-bar" style="width: ${hpPercent}%"></div></div>
                <div class="bar-container"><div class="mp-bar" style="width: ${mpPercent}%"></div></div>
            </div>
        `;
    });

    enemies.forEach((unit, idx) => {
        const activeClass = (turnOrder[currentTurnIndex] === unit) ? 'active' : '';
        const deadClass = unit.hp <= 0 ? 'dead' : '';
        const hpPercent = Math.max(0, (unit.hp / unit.maxHp) * 100);

        enemyContainer.innerHTML += `
            <div class="unit-card ${activeClass} ${deadClass}">
                <div class="unit-header">
                    <span>${unit.name}</span>
                    <span>HP: ${unit.hp}/${unit.maxHp}</span>
                </div>
                <div class="bar-container"><div class="hp-bar" style="width: ${hpPercent}%"></div></div>
            </div>
        `;
    });
}

function renderSkills(actor) {
    const container = document.getElementById('skills-container');
    container.innerHTML = '';

    if (!actor || enemies.length === 0 || actor.hp <= 0) return;

    actor.skills.forEach(skill => {
        const btn = document.createElement('button');
        btn.innerHTML = `${skill.name} <br><small>MP: ${skill.mpCost} | ${skill.desc}</small>`;
        btn.disabled = actor.mp < skill.mpCost;
        btn.onclick = () => executeHeroAction(actor, skill);
        container.appendChild(btn);
    });
}

// --- TURN MANAGEMENT ---
function calculateTurnOrder() {
    const aliveParty = party.filter(h => h.hp > 0);
    const aliveEnemies = enemies.filter(e => e.hp > 0);
    turnOrder = [...aliveParty, ...aliveEnemies].sort((a, b) => b.speed - a.speed);
    currentTurnIndex = 0;
}

function startTurn() {
    renderUnits();
    
    // Check combat end condition
    if (enemies.every(e => e.hp <= 0)) {
        addLog(`✨ ได้รับชัยชนะในด่านที่ ${currentStage + 1}!`, "system");
        partyExp += 50 * (currentStage + 1);
        document.getElementById('party-exp').innerText = partyExp;
        currentStage++;
        setTimeout(() => loadStage(currentStage), 1500);
        return;
    }
    
    if (party.every(h => h.hp <= 0)) {
        addLog(`☠️ ปาร์ตี้ของคุณพ่ายแพ้... ต้นอ่อนถูกทำลาย`, "enemy-action");
        alert("Game Over! ลองใหม่อีกครั้ง");
        initGame();
        return;
    }

    const currentUnit = turnOrder[currentTurnIndex];
    
    if (!currentUnit || currentUnit.hp <= 0) {
        nextTurn();
        return;
    }

    document.getElementById('turn-indicator').innerText = `ถึงเทิร์นของ: ${currentUnit.name}`;

    if (party.includes(currentUnit)) {
        renderSkills(currentUnit);
    } else {
        document.getElementById('skills-container').innerHTML = '';
        setTimeout(() => executeEnemyAI(currentUnit), 1000);
    }
}

function nextTurn() {
    currentTurnIndex = (currentTurnIndex + 1) % turnOrder.length;
    startTurn();
}

// --- ACTIONS ---
function executeHeroAction(actor, skill) {
    actor.mp -= skill.mpCost;
    let targetEnemy = enemies.find(e => e.hp > 0);

    if (skill.type === 'damage') {
        let dmg = Math.max(1, Math.floor((actor.atk * skill.power) - (targetEnemy.def * 0.5)));
        targetEnemy.hp -= dmg;
        addLog(`⚔️ ${actor.name} ใช้ [${skill.name}] ใส่ ${targetEnemy.name} สร้างความเสียหาย ${dmg}`, "hero-action");
    } else if (skill.type === 'aoe_damage') {
        enemies.filter(e => e.hp > 0).forEach(e => {
            let dmg = Math.max(1, Math.floor((actor.atk * skill.power) - (e.def * 0.3)));
            e.hp -= dmg;
            addLog(`⚡ [${skill.name}] โจมตีใส่ ${e.name} สร้างความเสียหาย ${dmg}`, "hero-action");
        });
    } else if (skill.type === 'buff_def') {
        party.forEach(h => h.def += 3);
        addLog(`🛡️ ${actor.name} ใช้ [${skill.name}] เพิ่มพลังป้องกันให้ทีม!`, "hero-action");
    } else if (skill.type === 'heal_all') {
        party.filter(h => h.hp > 0).forEach(h => {
            h.hp = Math.min(h.maxHp, h.hp + skill.power);
        });
        addLog(`💚 ${actor.name} ใช้ [${skill.name}] ฟื้นฟู HP ให้ทั้งทีม!`, "hero-action");
    } else if (skill.type === 'restore_mp') {
        actor.mp = Math.min(actor.maxMp, actor.mp + skill.power);
        addLog(`🔮 ${actor.name} ฟื้นฟู MP ${skill.power} หน่วย`, "hero-action");
    } else if (skill.type === 'self_buff_atk') {
        actor.atk += 5;
        addLog(`🔥 ${actor.name} คำรามเพิ่มพลังโจมตี!`, "hero-action");
    }

    nextTurn();
}

function executeEnemyAI(enemy) {
    const aliveParty = party.filter(h => h.hp > 0);
    if (aliveParty.length === 0) return;

    // Target lowest HP or random hero
    const target = aliveParty[Math.floor(Math.random() * aliveParty.length)];
    let dmg = Math.max(1, Math.floor(enemy.atk - (target.def * 0.4)));
    target.hp -= dmg;

    addLog(`💥 ${enemy.name} โจมตีใส่ ${target.name} สร้างความเสียหาย ${dmg}!`, "enemy-action");
    nextTurn();
}

function addLog(msg, type = "") {
    const logBox = document.getElementById('combat-log');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerText = msg;
    logBox.prepend(entry);
}

// Start Game
initGame();
</script>
</body>
</html>
